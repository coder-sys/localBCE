\* Combined model (all properties at once). Too big for this laptop's memory;
\* the 2026-09-25 runs used safety.cfg and live.cfg instead (see README.md).
\* Deeper run after this passes: Nodes = {n1, n2, n3}, Payments = {p1, p2, p3},
\* MaxEpoch = 4. Symmetry sets are deliberately not used (liveness is checked).

SPECIFICATION Spec

CONSTANTS
  Nodes    = {n1, n2}
  Payments = {p1, p2}
  MaxEpoch = 3
  NoNode   = NoNode

INVARIANTS
  TypeOK
  NoConflictingTokens
  NoFencedTokenAccepted
  ReleaseRequiresTokenOrBypass
  AtMostOnceRelease
  NoLostDecision

PROPERTIES
  StaleCannotSign
  EpochMonotone
  BypassEventuallyReconciled
