<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rules Review</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; color: #17201d; background: #f5f7f6; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: #173f35; color: white; }
    main { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 56px); }
    nav { padding: 16px; border-right: 1px solid #ccd5d1; background: white; overflow: auto; }
    button { border: 1px solid #73847d; background: white; padding: 8px 10px; cursor: pointer; }
    button.primary { background: #176b55; border-color: #176b55; color: white; }
    button.danger { color: #8b1e2d; border-color: #b7757f; }
    .task { width: 100%; margin: 0 0 8px; text-align: left; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: #ccd5d1; }
    section { padding: 20px; background: white; min-width: 0; }
    h1, h2 { margin: 0 0 12px; letter-spacing: 0; }
    h1 { font-size: 18px; } h2 { font-size: 16px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f0f3f2; padding: 12px; border: 1px solid #d8dfdc; min-height: 240px; }
    textarea { width: 100%; min-height: 90px; box-sizing: border-box; margin: 8px 0; }
    .actions { display: flex; gap: 8px; }
    .muted { color: #5c6a65; font-size: 13px; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid #ccd5d1; } .workspace { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><h1>Government Rules Review</h1><span id="identity" class="muted"></span></header>
  <main>
    <nav><button id="claim" class="primary">Claim next task</button><div id="tasks"></div></nav>
    <div class="workspace">
      <section><h2>Captured source evidence</h2><div id="sourceMeta" class="muted"></div><pre id="evidence"></pre></section>
      <section><h2>Typed rule draft</h2><div id="draftMeta" class="muted"></div><pre id="draft"></pre><textarea id="rationale" aria-label="Decision rationale"></textarea><div class="actions"><button id="approve" class="primary">Approve</button><button id="changes">Request changes</button><button id="reject" class="danger">Reject</button></div></section>
    </div>
  </main>
  <script>
    "use strict";
    const state = { task: null, candidate: null };
    const token = sessionStorage.getItem("rules_oidc_token") || "";
    const headers = token ? { Authorization: `Bearer ${token}` } : {};
    async function api(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { "content-type": "application/json", ...headers, ...(options.headers || {}) } });
      if (!response.ok) throw new Error((await response.json()).detail || `HTTP ${response.status}`);
      return response.json();
    }
    function renderCandidate(item) {
      state.candidate = item;
      document.getElementById("sourceMeta").textContent = `${item.canonical_url} | ${item.heading || "Untitled section"}`;
      document.getElementById("evidence").textContent = item.evidence_quote || "";
      const latest = item.drafts && item.drafts.length ? item.drafts[0] : item.candidate_payload;
      document.getElementById("draftMeta").textContent = `${item.primary_program} | ${item.grounding_status}`;
      document.getElementById("draft").textContent = JSON.stringify(latest, null, 2);
    }
    async function claim() {
      const payload = await api("/rules/tasks/claim", { method: "POST", body: "{}" });
      state.task = payload.task;
      if (!state.task) return;
      document.getElementById("identity").textContent = `${state.task.task_type} | ${state.task.task_id}`;
      renderCandidate(await api(`/rules/candidates/${encodeURIComponent(state.task.candidate_id)}`));
    }
    async function loadTasks() {
      const payload = await api("/rules/tasks?limit=100");
      const target = document.getElementById("tasks");
      target.replaceChildren();
      for (const task of payload.tasks) {
        const button = document.createElement("button");
        button.className = "task";
        button.textContent = `${task.status} | ${task.candidate_id}`;
        button.addEventListener("click", async () => {
          state.task = task;
          renderCandidate(await api(`/rules/candidates/${encodeURIComponent(task.candidate_id)}`));
        });
        target.appendChild(button);
      }
    }
    async function decide(decision) {
      if (!state.task) return;
      const suffix = state.task.task_type === "policy_review" ? "policy-decision" : state.task.task_type === "legal_verification" ? "legal-decision" : "conflict-decision";
      const payload = { decision: state.task.task_type === "conflict_resolution" ? "resolve" : decision, rationale: document.getElementById("rationale").value };
      if (state.task.task_type === "conflict_resolution") payload.selected_draft_id = state.task.draft_id;
      await api(`/rules/tasks/${encodeURIComponent(state.task.task_id)}/${suffix}`, { method: "POST", body: JSON.stringify(payload) });
      state.task = null;
      document.getElementById("rationale").value = "";
    }
    document.getElementById("claim").addEventListener("click", () => claim().catch(error => alert(error.message)));
    document.getElementById("approve").addEventListener("click", () => decide("approve").catch(error => alert(error.message)));
    document.getElementById("changes").addEventListener("click", () => decide("request_changes").catch(error => alert(error.message)));
    document.getElementById("reject").addEventListener("click", () => decide("reject").catch(error => alert(error.message)));
    window.renderRulesCandidate = renderCandidate;
    loadTasks().catch(error => { document.getElementById("tasks").textContent = error.message; });
  </script>
</body>
</html>
