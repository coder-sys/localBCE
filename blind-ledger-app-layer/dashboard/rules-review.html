<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rules Review</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; color: #17201d; background: #f5f7f6; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px; background: #173f35; color: white; }
    main { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 56px); }
    nav { padding: 16px; border-right: 1px solid #ccd5d1; background: white; overflow: auto; }
    button { border: 1px solid #73847d; background: white; padding: 8px 10px; cursor: pointer; }
    select { width: 100%; margin: 0 0 8px; padding: 8px; border: 1px solid #73847d; background: white; }
    button.primary { background: #176b55; border-color: #176b55; color: white; }
    button.danger { color: #8b1e2d; border-color: #b7757f; }
    .task { width: 100%; margin: 0 0 8px; text-align: left; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: #ccd5d1; }
    section { padding: 20px; background: white; min-width: 0; }
    h1, h2 { margin: 0 0 12px; letter-spacing: 0; }
    h1 { font-size: 18px; } h2 { font-size: 16px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f0f3f2; padding: 12px; border: 1px solid #d8dfdc; min-height: 240px; }
    textarea { width: 100%; min-height: 90px; box-sizing: border-box; margin: 8px 0; }
    .actions { display: flex; gap: 8px; }
    .tabs { display: flex; gap: 4px; }
    .tabs button { color: white; background: transparent; border-color: #8aa69d; }
    .tabs button[aria-selected="true"] { background: white; color: #173f35; }
    fieldset { border: 1px solid #ccd5d1; margin: 8px 0 12px; padding: 12px; }
    label { display: block; margin: 8px 0; }
    [hidden] { display: none !important; }
    .muted { color: #5c6a65; font-size: 13px; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid #ccd5d1; } .workspace { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Government Rules Review</h1>
    <div class="tabs" role="tablist" aria-label="Review queue">
      <button type="button" role="tab" data-mode="rules" aria-selected="true">Rules</button>
      <button type="button" role="tab" data-mode="quality" aria-selected="false">Quality</button>
      <button type="button" role="tab" data-mode="sources" aria-selected="false">Sources</button>
    </div>
    <span id="identity" class="muted"></span>
  </header>
  <main>
    <nav>
      <select id="sourceProgram" aria-label="Source program filter" hidden><option value="">Balanced queue</option></select>
      <select id="sourceMilestone" aria-label="Source milestone" hidden>
        <option value="5100">5,100 candidates</option>
        <option value="51000">51,000 candidates</option>
        <option value="600000">600,000 candidates</option>
      </select>
      <button id="claim" class="primary">Claim next task</button>
      <div id="tasks"></div>
    </nav>
    <div class="workspace">
      <section><h2>Captured source evidence</h2><div id="sourceMeta" class="muted"></div><pre id="evidence"></pre></section>
      <section>
        <h2 id="reviewHeading">Typed rule draft</h2>
        <div id="draftMeta" class="muted"></div>
        <pre id="draft"></pre>
        <div id="qualityMeasurements" hidden>
          <fieldset>
            <legend>Measurements</legend>
            <label><input type="checkbox" id="evidenceSpanPrecise"> Evidence span precise</label>
            <label><input type="checkbox" id="typedMappingCorrect"> Typed mapping correct</label>
            <label><input type="checkbox" id="programClassificationCorrect"> Program classification correct</label>
            <label><input type="checkbox" id="deterministicRerunMatch"> Deterministic rerun match</label>
          </fieldset>
        </div>
        <textarea id="rationale" aria-label="Decision rationale"></textarea>
        <div id="ruleActions" class="actions">
          <button id="approve" class="primary">Approve</button>
          <button id="changes">Request changes</button>
          <button id="reject" class="danger">Reject</button>
        </div>
        <div id="qualityActions" class="actions" hidden>
          <button id="submitQuality" class="primary">Submit measurements</button>
        </div>
        <div id="sourceActions" class="actions" hidden>
          <button id="approveSource" class="primary">Approve for registry</button>
          <button id="rejectSource" class="danger">Reject</button>
        </div>
        <div id="claimActions" class="actions" hidden>
          <button id="renewClaim">Renew claim</button>
          <button id="releaseClaim" class="danger">Release claim</button>
        </div>
      </section>
    </div>
  </main>
  <script>
    "use strict";
    const state = { mode: "rules", task: null, candidate: null, ownsClaim: false };
    const token = sessionStorage.getItem("rules_oidc_token") || "";
    const headers = token ? { Authorization: `Bearer ${token}` } : {};
    async function api(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { "content-type": "application/json", ...headers, ...(options.headers || {}) } });
      if (!response.ok) throw new Error((await response.json()).detail || `HTTP ${response.status}`);
      return response.json();
    }
    function clearWorkspace() {
      state.task = null;
      state.candidate = null;
      state.ownsClaim = false;
      document.getElementById("sourceMeta").textContent = "";
      document.getElementById("evidence").textContent = "";
      document.getElementById("draftMeta").textContent = "";
      document.getElementById("draft").textContent = "";
      document.getElementById("rationale").value = "";
      document.getElementById("identity").textContent = "";
      document.getElementById("claimActions").hidden = true;
      document.getElementById("approveSource").disabled = false;
      for (const checkbox of document.querySelectorAll("#qualityMeasurements input")) checkbox.checked = false;
    }
    function configureActions() {
      document.getElementById("ruleActions").hidden = state.mode !== "rules";
      document.getElementById("qualityActions").hidden = state.mode !== "quality";
      document.getElementById("sourceActions").hidden = state.mode !== "sources";
      document.getElementById("qualityMeasurements").hidden = state.mode !== "quality";
      document.getElementById("reviewHeading").textContent = state.mode === "sources" ? "Source candidate" : state.mode === "quality" ? "Quality sample" : "Typed rule draft";
      document.getElementById("claim").textContent = state.mode === "sources" ? "Claim source" : state.mode === "quality" ? "Claim quality sample" : "Claim next task";
      document.getElementById("sourceProgram").hidden = state.mode !== "sources";
      document.getElementById("sourceMilestone").hidden = state.mode !== "sources";
      document.getElementById("claimActions").hidden = !state.ownsClaim;
    }
    function renderCandidate(item) {
      state.candidate = item;
      document.getElementById("sourceMeta").textContent = `${item.canonical_url} | ${item.heading || "Untitled section"}`;
      document.getElementById("evidence").textContent = item.evidence_quote || "";
      const latest = item.drafts && item.drafts.length ? item.drafts[0] : item.candidate_payload;
      document.getElementById("draftMeta").textContent = `${item.primary_program} | ${item.grounding_status}`;
      document.getElementById("draft").textContent = JSON.stringify(latest, null, 2);
    }
    function renderSource(item) {
      state.candidate = item;
      document.getElementById("sourceMeta").textContent = `${item.parent_url} | ${item.issuer}`;
      document.getElementById("evidence").textContent = item.link_text || "";
      const blockers = item.preflight_blockers || [];
      document.getElementById("draftMeta").textContent = `${item.program} | ${item.review_status} | preflight ${item.preflight_score}`;
      document.getElementById("approveSource").disabled = blockers.length > 0;
      document.getElementById("draft").textContent = JSON.stringify({ candidate_url: item.candidate_url, parent_snapshot_hash: item.parent_snapshot_hash, source_locator: item.source_locator, canonical_run_hash: item.canonical_run_hash, preflight_version: item.preflight_version, preflight_score: item.preflight_score, preflight_blockers: blockers, preflight_signals: item.preflight_signals, preflight_hash: item.preflight_hash, automatic_registry_activation: false }, null, 2);
    }
    async function loadSourcePrograms() {
      const target = document.getElementById("sourceMilestone").value;
      const payload = await api(`/rules/sources/preflight?target_count=${encodeURIComponent(target)}`);
      const select = document.getElementById("sourceProgram");
      select.replaceChildren();
      const balanced = document.createElement("option");
      balanced.value = "";
      balanced.textContent = "Balanced queue";
      select.appendChild(balanced);
      for (const item of payload.source_review_priority_programs || []) {
        if (!item.eligible_source_candidates) continue;
        const option = document.createElement("option");
        option.value = item.program;
        option.textContent = `${item.program} | ${item.accepted_grounded_candidates}/${item.candidate_quota} | ${item.eligible_source_candidates} sources`;
        select.appendChild(option);
      }
    }
    async function claim() {
      let endpoint = state.mode === "quality" ? "/rules/quality/tasks/claim" : state.mode === "sources" ? "/rules/sources/tasks/claim" : "/rules/tasks/claim";
      if (state.mode === "sources") {
        const program = document.getElementById("sourceProgram").value;
        if (program) endpoint += `?program=${encodeURIComponent(program)}`;
      }
      const payload = await api(endpoint, { method: "POST", body: "{}" });
      state.task = payload.task;
      if (!state.task) return;
      state.ownsClaim = true;
      document.getElementById("claimActions").hidden = false;
      if (state.mode === "sources") {
        document.getElementById("identity").textContent = state.task.source_candidate_id;
        renderSource(await api(`/rules/sources/candidates/${encodeURIComponent(state.task.source_candidate_id)}`));
      } else {
        document.getElementById("identity").textContent = state.task.task_type ? `${state.task.task_type} | ${state.task.task_id}` : state.task.sample_id;
        renderCandidate(await api(`/rules/candidates/${encodeURIComponent(state.task.candidate_id)}`));
      }
    }
    async function loadTasks() {
      const payload = await api("/rules/tasks?limit=100");
      const target = document.getElementById("tasks");
      target.replaceChildren();
      for (const task of payload.tasks) {
        const button = document.createElement("button");
        button.className = "task";
        button.textContent = `${task.status} | ${task.candidate_id}`;
        button.addEventListener("click", async () => {
          state.task = task;
          state.ownsClaim = false;
          document.getElementById("claimActions").hidden = true;
          renderCandidate(await api(`/rules/candidates/${encodeURIComponent(task.candidate_id)}`));
        });
        target.appendChild(button);
      }
    }
    async function decide(decision) {
      if (!state.task) return;
      const suffix = state.task.task_type === "policy_review" ? "policy-decision" : state.task.task_type === "legal_verification" ? "legal-decision" : "conflict-decision";
      const payload = { decision: state.task.task_type === "conflict_resolution" ? "resolve" : decision, rationale: document.getElementById("rationale").value };
      if (state.task.task_type === "conflict_resolution") payload.selected_draft_id = state.task.draft_id;
      await api(`/rules/tasks/${encodeURIComponent(state.task.task_id)}/${suffix}`, { method: "POST", body: JSON.stringify(payload) });
      clearWorkspace();
    }
    async function submitQuality() {
      if (!state.task || !state.candidate) return;
      const payload = {
        candidate_id: state.task.candidate_id,
        draft_hash: state.task.draft_hash,
        rationale: document.getElementById("rationale").value,
        measurements: {
          evidence_span_precise: document.getElementById("evidenceSpanPrecise").checked,
          typed_mapping_correct: document.getElementById("typedMappingCorrect").checked,
          program_classification_correct: document.getElementById("programClassificationCorrect").checked,
          deterministic_rerun_match: document.getElementById("deterministicRerunMatch").checked
        }
      };
      await api(`/rules/quality/tasks/${encodeURIComponent(state.task.sample_id)}/review`, { method: "POST", body: JSON.stringify(payload) });
      clearWorkspace();
    }
    async function decideSource(decision) {
      if (!state.task) return;
      await api(`/rules/sources/tasks/${encodeURIComponent(state.task.source_candidate_id)}/decision`, { method: "POST", body: JSON.stringify({ decision, rationale: document.getElementById("rationale").value }) });
      clearWorkspace();
    }
    function claimEndpoint(action) {
      if (!state.task) return null;
      if (state.mode === "sources") return `/rules/sources/tasks/${encodeURIComponent(state.task.source_candidate_id)}/${action}`;
      if (state.mode === "quality") return `/rules/quality/tasks/${encodeURIComponent(state.task.sample_id)}/${action}`;
      return `/rules/tasks/${encodeURIComponent(state.task.task_id)}/${action}`;
    }
    async function renewClaim() {
      if (!state.ownsClaim) return;
      const endpoint = claimEndpoint("renew");
      if (!endpoint) return;
      const renewed = await api(endpoint, { method: "POST", body: "{}" });
      state.task = { ...state.task, ...renewed };
      document.getElementById("identity").textContent = `${document.getElementById("identity").textContent.split(" | lease ")[0]} | lease ${renewed.claim_expires_at}`;
    }
    async function releaseClaim() {
      if (!state.ownsClaim) return;
      const endpoint = claimEndpoint("release");
      if (!endpoint) return;
      await api(endpoint, { method: "POST", body: "{}" });
      clearWorkspace();
      if (state.mode === "rules") await loadTasks();
    }
    function setMode(mode) {
      state.mode = mode;
      for (const tab of document.querySelectorAll('[role="tab"]')) tab.setAttribute("aria-selected", String(tab.dataset.mode === mode));
      clearWorkspace();
      configureActions();
      if (mode === "rules") loadTasks().catch(error => { document.getElementById("tasks").textContent = error.message; });
      else if (mode === "sources") loadSourcePrograms().catch(error => { document.getElementById("tasks").textContent = error.message; });
      else document.getElementById("tasks").replaceChildren();
    }
    document.getElementById("claim").addEventListener("click", () => claim().catch(error => alert(error.message)));
    document.getElementById("approve").addEventListener("click", () => decide("approve").catch(error => alert(error.message)));
    document.getElementById("changes").addEventListener("click", () => decide("request_changes").catch(error => alert(error.message)));
    document.getElementById("reject").addEventListener("click", () => decide("reject").catch(error => alert(error.message)));
    document.getElementById("submitQuality").addEventListener("click", () => submitQuality().catch(error => alert(error.message)));
    document.getElementById("approveSource").addEventListener("click", () => decideSource("approve_for_registry").catch(error => alert(error.message)));
    document.getElementById("rejectSource").addEventListener("click", () => decideSource("reject").catch(error => alert(error.message)));
    document.getElementById("renewClaim").addEventListener("click", () => renewClaim().catch(error => alert(error.message)));
    document.getElementById("releaseClaim").addEventListener("click", () => releaseClaim().catch(error => alert(error.message)));
    document.getElementById("sourceMilestone").addEventListener("change", () => loadSourcePrograms().catch(error => { document.getElementById("tasks").textContent = error.message; }));
    for (const tab of document.querySelectorAll('[role="tab"]')) tab.addEventListener("click", () => setMode(tab.dataset.mode));
    window.renderRulesCandidate = renderCandidate;
    configureActions();
    loadTasks().catch(error => { document.getElementById("tasks").textContent = error.message; });
  </script>
</body>
</html>
