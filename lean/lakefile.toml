name = "RightRail"
version = "0.1.0"
defaultTargets = ["BlindLedger", "blind_semantic_kernel"]

# One Lake workspace (Constitution IX.1).  `BlindLedger` holds the financial
# correction transition, the Semantic kernel and the shared `BlindLedger.Sha3`.
# Parked, not built: the State kernel (`parked/state_clearance/lean`) and the
# unbuilt Kernel-series/System modules (`parked/lean_unbuilt`).

[[lean_lib]]
name = "BlindLedger"

[[lean_exe]]
name = "blind_semantic_kernel"
root = "BlindLedger.SemanticCli"
moreLinkArgs = ["-Wl,--no-insert-timestamp"]

[[lean_exe]]
name = "blind_financial"
root = "BlindLedger.Financial.Cli"
moreLinkArgs = ["-Wl,--no-insert-timestamp"]

[[lean_exe]]
name = "blind_financial_correction"
root = "BlindLedger.Financial.CorrectionTransitionCli"
moreLinkArgs = ["-Wl,--no-insert-timestamp"]

[[lean_exe]]
name = "blind_financial_axioms"
root = "BlindLedger.Financial.AxiomCheck"
moreLinkArgs = ["-Wl,--no-insert-timestamp"]
