<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medi-Cal Claims Inbox</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/styles.css?v=neer-inbox-6" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>Medi-Cal Claims Inbox</h1>
          <p id="sessionSummary">9 active &middot; 0 waiting &middot; 0 ready &middot; 0 closed &middot; 2 high SLA</p>
          <div class="day-arc">
            <span id="sessionClock">Closed</span>
            <span class="day-arc-track"><span id="dayArcFill"></span></span>
            <span id="authState">0/9</span>
          </div>
        </div>

        <div class="topbar-center">
          <label class="search" aria-label="Search claims queue">
            <span aria-hidden="true">/</span>
            <input id="searchInput" autocomplete="off" placeholder="Search queue" />
          </label>
          <nav class="filters" aria-label="Claim views">
            <button class="filter active" data-filter="my_queue">My queue</button>
            <button class="filter" data-filter="missing_auth">Missing auth</button>
            <button class="filter" data-filter="sla_risk">SLA risk</button>
            <button class="filter" data-filter="ready_for_release">Ready for release</button>
          </nav>
        </div>

        <div class="topbar-utility">
          <button id="themeToggle" class="theme-toggle" type="button">Dark</button>
          <button id="commandButton" class="command-hint" type="button" aria-label="Open command palette">
            <kbd>Ctrl K</kbd>
          </button>
        </div>
      </header>

      <main class="layout">
        <aside class="queue" aria-label="Work queue">
          <div class="queue-head">
            <div>
              <h2 id="queueTitle">Work queue</h2>
              <p id="queueSort">Sorted by SLA risk, oldest first</p>
            </div>
            <div class="queue-tools">
              <select id="sortSelect" aria-label="Sort work queue">
                <option value="risk_oldest">Risk / oldest</option>
                <option value="oldest">Oldest date</option>
                <option value="amount">Amount</option>
              </select>
              <span id="queueCount">9</span>
            </div>
          </div>
          <div id="queueList" class="queue-list" role="listbox" aria-label="Claims awaiting operator action"></div>
        </aside>

        <section id="decisionPane" class="decision" aria-live="polite"></section>

        <aside id="railPane" class="rail" aria-label="Case record"></aside>
      </main>
    </div>

    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
    <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
      <div class="drawer-head">
        <div>
          <p id="drawerKicker">Claim</p>
          <h2 id="drawerTitle">Action</h2>
        </div>
        <button id="drawerClose" type="button">Close</button>
      </div>
      <div id="drawerBody" class="drawer-body"></div>
    </aside>

    <div id="commandPalette" class="command-palette" hidden>
      <div class="command-box" role="dialog" aria-modal="true" aria-labelledby="commandTitle">
        <h2 id="commandTitle">Commands</h2>
        <button type="button" data-command="focus-search">Search queue</button>
        <button type="button" data-command="next-claim">Next claim</button>
        <button type="button" data-command="previous-claim">Previous claim</button>
        <button type="button" data-command="primary-action">Primary action</button>
        <button type="button" data-command="system-audit">System audit</button>
        <button type="button" data-command="toggle-theme">Toggle theme</button>
        <button type="button" data-command="reset">Reset session</button>
      </div>
    </div>

    <script src="/static/app.js?v=neer-inbox-6"></script>
  </body>
</html>
