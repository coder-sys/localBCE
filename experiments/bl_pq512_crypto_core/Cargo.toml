[package]
name = "bl_pq512_crypto_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
default = []
std = []
parallel = ["std"]
bench_fixture_coin = ["parallel"]
control_reference = []
test_entropy_injection = []

[dependencies]
getrandom = { version = "=0.3.4" }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
sha3 = { version = "=0.10.9", default-features = false }
slh-dsa = { version = "=0.2.0-rc.5" }
zeroize = { version = "=1.9.0" }

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "scalar-throughput"
path = "src/bin/scalar_throughput.rs"

[[bin]]
name = "wave1a-dimensions"
path = "src/bin/wave1a_dimensions.rs"

[[bin]]
name = "sha3-trace-throughput"
