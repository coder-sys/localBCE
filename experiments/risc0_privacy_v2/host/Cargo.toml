[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
methods = { path = "../methods" }
privacy-v2-model = { path = "../model" }
risc0-zkvm = { version = "=3.0.5", features = ["disable-dev-mode"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["local-prover-profile"]
local-prover-profile = ["risc0-zkvm/prove"]
cuda = ["risc0-zkvm/cuda"]
