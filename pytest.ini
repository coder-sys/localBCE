[pytest]
# The default run covers the product tests only. Parked work (Constitution IX.4) is
# excluded here but not hidden: run it explicitly with `pytest parked` and report its
# failures (if your pytest applies norecursedirs to explicit paths, add
# `-o "norecursedirs=.* __pycache__"`). `provider_app` is a separate project with its
# own `tests` package and pyproject; run its tests from inside `provider_app/`.
testpaths = tests
norecursedirs =
    .*
    __pycache__
    venv
    node_modules
    target
    work
    parked
    provider_app
