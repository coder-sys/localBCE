[pytest]
# The default run covers the product tests only. Parked work (Constitution IX.4) is
# excluded here but not hidden: run it explicitly with `pytest parked` and report its
# failures (if your pytest applies norecursedirs to explicit paths, add
# `-o "norecursedirs=cache .git .venv venv target node_modules"`).
testpaths = tests
norecursedirs =
    cache
    .git
    .venv
    venv
    target
    node_modules
    parked
