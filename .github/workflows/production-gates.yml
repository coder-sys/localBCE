name: production-gates

on:
  push:
    branches: [codex-dev]
  pull_request:

permissions:
  contents: read

# Groth16, STARK and Solidity/on-chain jobs were removed when that code was
# parked under parked/localbce/ (docs/integration/RIGHTRAIL_BASE_PLAN.md).

jobs:
  rules-and-ops:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: localbce_rules_test
          POSTGRES_USER: localbce_rules_test
          POSTGRES_PASSWORD: localbce_rules_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localbce_rules_test -d localbce_rules_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RULES_TEST_DATABASE_URL: postgresql://localbce_rules_test:localbce_rules_test@127.0.0.1:5432/localbce_rules_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m venv gov-rules-kg-prototype/.venv
      - run: gov-rules-kg-prototype/.venv/bin/pip install -r gov-rules-kg-prototype/requirements.txt -r blind-ledger-app-layer/requirements.txt
      # Built so the G-rule parity end-to-end tests run instead of skipping.
      - run: cargo build --manifest-path rust-engine/Cargo.toml --jobs 1
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      # tests/ needs pypdf (gov-rules-kg-prototype/requirements.txt), installed only in this venv.
      - run: gov-rules-kg-prototype/.venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/validate_ops_scaffold.py
      - run: bash scripts/validate_rules_pipeline.sh
      - run: PYTHONPATH=blind-ledger-app-layer:gov-rules-kg-prototype/src gov-rules-kg-prototype/.venv/bin/python -m unittest blind-ledger-app-layer/tests/test_rules_review_auth.py
      - run: python3 scripts/scan_secrets.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust-engine/Cargo.toml --jobs 1
      - run: cargo check --manifest-path rust-engine/Cargo.toml --jobs 1

  windows-smoke:
    # Windows runs the active localBCE suites: rust-engine and both Python suites. The
    # Postgres-backed rules pipeline and app-layer auth tests stay Linux-only (rules-and-ops);
    # RightRail's own suite needs its guard script and Lean toolchain (RIGHTRAIL_BASE_PLAN.md §7).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust-engine/Cargo.toml --jobs 1
        shell: bash
      - run: cargo build --manifest-path rust-engine/Cargo.toml --jobs 1
        shell: bash
      # pypdf is the only third-party module the two suites import.
      - run: python -m pip install pypdf
        shell: bash
      - name: scripts/tests (all)
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
        shell: bash
      - name: tests (all)
        run: python -m unittest discover -s tests -p 'test_*.py'
        shell: bash
