name: production-gates

on:
  push:
    branches: [codex-dev]
  pull_request:

permissions:
  contents: read

jobs:
  rules-and-ops:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: localbce_rules_test
          POSTGRES_USER: localbce_rules_test
          POSTGRES_PASSWORD: localbce_rules_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localbce_rules_test -d localbce_rules_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RULES_TEST_DATABASE_URL: postgresql://localbce_rules_test:localbce_rules_test@127.0.0.1:5432/localbce_rules_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m venv gov-rules-kg-prototype/.venv
      - run: gov-rules-kg-prototype/.venv/bin/pip install -r gov-rules-kg-prototype/requirements.txt -r blind-ledger-app-layer/requirements.txt
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 scripts/validate_ops_scaffold.py
      - run: python3 scripts/validate_policy_manifest.py ops/policy_manifest.example.json
      - run: python3 scripts/validate_openzeppelin_pin.py
      - run: python3 -m unittest tests.test_stark_validation_config_gate
      - run: bash scripts/validate_rules_pipeline.sh
      - run: PYTHONPATH=blind-ledger-app-layer:gov-rules-kg-prototype/src gov-rules-kg-prototype/.venv/bin/python -m unittest blind-ledger-app-layer/tests/test_rules_review_auth.py
      - run: python3 scripts/scan_secrets.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust-engine/Cargo.toml --jobs 1
      - run: cargo check --manifest-path rust-engine/Cargo.toml --jobs 1
      - run: cargo test --manifest-path stark-engine/Cargo.toml --all-features --jobs 1
      - run: cargo check --manifest-path stark-engine/Cargo.toml --all-features --jobs 1

  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root blind-ledger
      - run: forge build --root blind-ledger
      - run: forge test --root blind-ledger --gas-report

  stark-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/validate_stark_bridge_chain.sh

  governed-v2-anvil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
      - run: bash scripts/validate_stark_v2_anvil.sh

  windows-smoke:
    # Phase 0 partial: Windows coverage of the gate unit test and the self-check only.
    # Full Windows coverage of existing suites is an OPEN_QUESTIONS item.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_stark_validation_config_gate
      # One step per file so each failure is visible in the step result (job logs are not
      # readable from outside GitHub). Discover-based run is replaced by these.
      - name: diag eol of vendored OpenZeppelin on Windows checkout (pass = no CRLF)
        run: "! git ls-files --eol blind-ledger/lib/openzeppelin-contracts | grep -q w/crlf"
        shell: bash
      - name: diag openzeppelin pin validator script (exit code)
        run: python scripts/validate_openzeppelin_pin.py
        shell: bash
      - name: scripts/tests test_openzeppelin_pin
        run: python -m unittest test_openzeppelin_pin
        working-directory: scripts/tests
        shell: bash
      - name: scripts/tests test_stark_sepolia_pilot
        run: python -m unittest test_stark_sepolia_pilot
        working-directory: scripts/tests
        shell: bash
