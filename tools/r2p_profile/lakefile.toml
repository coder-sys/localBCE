name = "r2p_profile"
version = "0.1.0"
defaultTargets = ["r2p_rules", "r2p_bench"]

# R2P measurement (2026-10-13), a separate package so lean/lakefile.toml (in the rules source digest) and the pinned exes are untouched.
# `r2p_rules` is gate_rules_worker with stage timers (worker with no argument, one-shot with a path); `r2p_bench` times the hot
# pure functions (`micro`) and the publish check (`verify`).  Neither is a product artifact.  Only the exes' import closures build.
[[lean_lib]]
name = "BlindLedger"
srcDir = "../../lean"
roots = ["BlindLedger"]
globs = ["BlindLedger.+"]

[[lean_exe]]
name = "r2p_rules"
root = "RulesWorkerTimed"

[[lean_exe]]
name = "r2p_bench"
root = "R2pBench"
