services:
  rules-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: localbce_rules
      POSTGRES_USER: localbce_rules
      POSTGRES_PASSWORD: ${RULES_POSTGRES_PASSWORD:?set RULES_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localbce_rules -d localbce_rules"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rules_postgres_data:/var/lib/postgresql/data

volumes:
  rules_postgres_data:
