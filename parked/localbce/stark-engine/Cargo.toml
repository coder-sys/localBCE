[package]
name = "stark-engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
production-air = []
production-air-winterfell = ["production-air", "dep:winterfell"]
real-prover-adapter = []
winterfell-poc = ["dep:blind-ledger-stark"]

[dependencies]
blind-ledger-stark = { path = "../blind-ledger-app-layer/zk-stark", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
secp256k1 = { version = "0.31", features = ["recovery"] }
wait-timeout = "0.2"
winterfell = { version = "0.13.1", optional = true }

[[bin]]
name = "generate_bridge_backed_winterfell_proof_evidence"
path = "src/bin/generate_bridge_backed_winterfell_proof_evidence.rs"
required-features = ["winterfell-poc"]

[[bin]]
name = "generate_production_stark_proof_artifact"
path = "src/bin/generate_production_stark_proof_artifact.rs"
required-features = ["production-air-winterfell"]

[[bin]]
name = "validate_production_stark_proof_artifact"
path = "src/bin/validate_production_stark_proof_artifact.rs"
required-features = ["production-air-winterfell"]

[[bin]]
name = "generate_production_stark_verifier_handoff"
path = "src/bin/generate_production_stark_verifier_handoff.rs"
required-features = ["production-air-winterfell"]

[[bin]]
name = "validate_production_stark_verifier_handoff"
path = "src/bin/validate_production_stark_verifier_handoff.rs"
required-features = ["production-air-winterfell"]

[[bin]]
name = "generate_production_claim_source_root"
